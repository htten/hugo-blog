# 自部署用 nginx 站点配置（Hugo 静态站）
# 用法：复制到 /etc/nginx/sites-available/blog-hugo 并软链到 sites-enabled/，
#      然后 nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name htten.cc.cd;

    root /var/www/blog/public;
    index index.html;

    access_log /var/log/nginx/blog-hugo.access.log;
    error_log  /var/log/nginx/blog-hugo.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    # 隐藏 dotfiles
    location ~ /\. {
        deny all;
    }

    # 配合 CDN 时回源到 HTTPS（按需启用）
    # return 301 https://$host$request_uri;
}
