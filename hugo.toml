baseURL = 'https://htten.cc.cd/'
defaultContentLanguage = 'zh'
title = 'HTTEN 的博客'
enableGitInfo = true
disablePathToLower = false
copyright = '© 2026 HTTEN · Powered by Hugo'

# 无第三方主题：样式复刻自原 PHP 博客（Hallmark · Editorial），模板在 layouts/
[languages]
  [languages.zh]
    languageName = '中文'
    languageCode = 'zh-CN'
    contentDir = 'content'
    weight = 1
    title = 'HTTEN 的博客'
    [languages.zh.params]
      description = 'AI 应用、开发者工具、生产力哲学'

[taxonomies]
  category = 'categories'
  tag = 'tags'

[pagination]
  pagerSize = 10

[outputs]
  home = ['html', 'rss']
  section = ['html', 'rss']
  taxonomy = ['html', 'rss']
  term = ['html', 'rss']

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    [markup.goldmark.parser.attribute]
      block = true
      title = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    style = 'base16-snazzy'

[params]
  description = 'AI 应用、开发者工具、生产力哲学'
  author = 'HTTEN'
  repo = 'https://github.com/htten/hugo-blog'
