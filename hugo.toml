baseURL = 'https://htten.cc.cd/'
defaultContentLanguage = 'zh'
title = 'HTTEN 的博客'
enableGitInfo = true
disablePathToLower = false
copyright = '© 2026 HTTEN · Powered by Hugo'
theme = 'blog'

# 主题：hugo new theme blog（Hugo 官方脚手架生成），模板在 themes/blog/
[languages]
  [languages.zh]
    languageName = '中文'
    languageCode = 'zh-CN'
    contentDir = 'content'
    weight = 1
    title = 'HTTEN 的博客'
    [languages.zh.params]
      description = 'AI 应用、开发者工具、生产力哲学'

[taxonomies]
  category = 'categories'
  tag = 'tags'

[pagination]
  pagerSize = 10

[outputs]
  home = ['html', 'rss']
  section = ['html', 'rss']
  taxonomy = ['html', 'rss']
  term = ['html', 'rss']

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    [markup.goldmark.parser.attribute]
      block = true
      title = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    style = 'base16-snazzy'

[params]
  description = 'AI 应用、开发者工具、生产力哲学'
  author = 'HTTEN'
  repo = 'https://github.com/htten/hugo-blog'

[menus]
  [[menus.main]]
    name = '首页'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    name = '文章'
    pageRef = '/posts/'
    weight = 20

  [[menus.main]]
    name = '关于'
    pageRef = '/about/'
    weight = 30

  [[menus.main]]
    name = '标签'
    pageRef = '/tags/'
    weight = 40
