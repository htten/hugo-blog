<header class="site-header">
    <div class="container">
        <a href="{{ "/" | relURL }}" class="logo">{{ site.Title }}</a>
        <nav class="main-nav" aria-label="主导航">
            <a href="{{ "/" | relURL }}"{{ if .IsHome }} class="active"{{ end }}>首页</a>
            <a href="{{ "/posts/" | relURL }}"{{ if eq .Section "posts" }} class="active"{{ end }}>归档</a>
            <a href="{{ "/categories/" | relURL }}"{{ if eq .Kind "taxonomy" }} class="active"{{ end }}>分类</a>
            <a href="{{ "/tags/" | relURL }}"{{ if eq .Kind "term" }} class="active"{{ end }}>标签</a>
            <a href="{{ "/about/" | relURL }}"{{ if eq .RelPermalink "/about/" }} class="active"{{ end }}>关于</a>
            <a href="https://github.com/htten/hugo-blog" class="nav-admin" rel="noopener">GitHub</a>
        </nav>
    </div>
</header>
