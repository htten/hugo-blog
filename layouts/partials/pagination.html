{{ $paginator := .Paginate .Pages }}
{{ if gt $paginator.TotalPages 1 }}
    <nav class="pagination" aria-label="分页导航">
        {{ with $paginator.Prev }}
            <a href="{{ .URL }}" class="page-link">← 上一页</a>
        {{ end }}
        <span class="page-info">第 {{ $paginator.PageNumber }} / {{ $paginator.TotalPages }} 页</span>
        {{ with $paginator.Next }}
            <a href="{{ .URL }}" class="page-link">下一页 →</a>
        {{ end }}
    </nav>
{{ end }}
