<article class="post-card">
    <h2 class="post-title">
        <a href="{{ .page.RelPermalink }}">{{ .page.Title }}</a>
    </h2>
    <div class="post-meta">
        <time datetime="{{ .page.Date.Format "2006-01-02" }}">{{ .page.Date.Format "2006-01-02" }}</time>
        {{ with .page.Params.categories }}
            <span class="meta-sep">·</span>
            {{ range . }}
                <a href="{{ "/categories/" | relURL }}{{ lower (. | urlize) }}/" class="category-link">{{ . }}</a>
            {{ end }}
        {{ end }}
    </div>
    <p class="post-excerpt">{{ with .page.Description }}{{ . }}{{ else }}{{ .page.Summary | plainify | truncate 200 }}{{ end }}</p>
    <a href="{{ .page.RelPermalink }}" class="read-more">阅读全文 →</a>
</article>
