{{ define "main" }}
  <article>
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
      {{ with .Date }}
        <div class="post-meta">
          <time datetime="{{ . | time.Format "2006-01-02T15:04:05-07:00" }}">{{ . | time.Format "2006年1月2日" }}</time>
          {{ with $.ReadingTime }}<span class="meta-sep">·</span><span>{{ . }} 分钟阅读</span>{{ end }}
        </div>
      {{ end }}
    </header>

    {{ with .TableOfContents }}
      <details class="toc">
        <summary>目录</summary>
        {{ . }}
      </details>
    {{ end }}

    <div class="post-content">
      {{ .Content }}
    </div>
  </article>
  {{ partial "terms.html" (dict "taxonomy" "tags" "page" .) }}
{{ end }}
