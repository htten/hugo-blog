{{ define "main" }}
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>
  {{ .Content }}

  <div class="post-list">
    {{ range .Pages }}
      <article class="post-card">
        <h2 class="post-card-title"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
        <p class="post-summary">{{ len .Pages }} 篇文章</p>
      </article>
    {{ end }}
  </div>
{{ end }}
